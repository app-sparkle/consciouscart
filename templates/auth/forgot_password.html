<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password – ConsciousCart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body class="bg-light">
  <div class="container py-5" style="max-width: 480px;">
    <div class="card shadow-sm p-4">
      <h2 class="fw-bold mb-1">Reset Password</h2>
      <p class="text-muted mb-4">Enter your registered email to receive password reset instructions.</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ 'danger' if category == 'error' else category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST">
        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input type="email" class="form-control" id="email" name="email" required>
        </div>
        <button type="submit" class="btn btn-success w-100 py-2">Send Reset Link</button>
      </form>

      <div class="text-center mt-3">
        <a href="/login">Back to Login</a>
      </div>
    </div>
  </div>
</body>
</html>
